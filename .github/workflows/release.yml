name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The packager builds the changelog from git history, so a shallow
          # clone would produce an empty one.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Never publish something that does not parse.
      - run: npm run verify

      - uses: BigWigsMods/packager@v2
        env:
          # Provided automatically by Actions; no secret to configure.
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

          # The CurseForge variable was renamed: the v2 tag reads CF_API_KEY,
          # while master reads CF_API_TOKEN. Both are set from the same secret
          # so this keeps working whichever version the tag resolves to - the
          # symptom otherwise is a silent skip with no error anywhere.
          CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

          # Optional. Each site is skipped until both its token is set here and
          # its ID is present in KickBaton.toc.
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
