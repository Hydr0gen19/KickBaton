name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The packager builds the changelog from git history, so a shallow
          # clone would produce an empty one.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Never publish something that does not parse.
      - run: npm run verify

      # Lengths only - never the values. Tells us whether a token reached the
      # runner at all, which the packager's own output does not distinguish
      # from a token it simply chose not to use.
      - name: Check token propagation
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
          WAGO: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          echo "CF_API_TOKEN length:   ${#CF}"
          echo "WAGO_API_TOKEN length: ${#WAGO}"

      - uses: BigWigsMods/packager@v2
        env:
          # Provided automatically by Actions; no secret to configure.
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # The rest are optional. Each site is skipped until both its token is
          # set here and its ID is present in KickBaton.toc.
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
